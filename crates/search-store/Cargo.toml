[package]
name = "search-store"
version = "0.1.0"
edition = "2021"
description = "LastStore-backed keyword index for the first-party Search app"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
laststore = { path = "../../vendor/laststore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "search-store"
path = "src/main.rs"
